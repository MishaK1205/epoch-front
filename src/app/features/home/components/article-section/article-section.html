<section class="section" [attr.aria-label]="title()">
  <div class="section__head">
    <h2 class="section__title">{{ title() }}</h2>
    @if (link(); as link) {
      <a class="section__more" appButton variant="outline" size="sm" pill [routerLink]="link">
        ყველა სტატია
        <app-icon btnIconEnd name="chevron-right" [size]="16" />
      </a>
    }
  </div>

  @if (lead(); as lead) {
    @let readIds = readArticleIds();
    <div class="section__grid">
      <app-article-card [article]="lead" variant="lead" [read]="readIds.has(lead.id)">
        @if (loggedIn()) {
          <app-reading-list-toggle cardAction appearance="icon" [articleId]="lead.id" />
        }
      </app-article-card>
      @if (sideItems().length > 0) {
        <ul class="section__side" role="list">
          @for (article of sideItems(); track article.id) {
            <li>
              <app-article-card [article]="article" [read]="readIds.has(article.id)">
                @if (loggedIn()) {
                  <app-reading-list-toggle
                    cardAction
                    appearance="icon"
                    size="sm"
                    [articleId]="article.id"
                  />
                }
              </app-article-card>
            </li>
          }
        </ul>
      }
    </div>
  }
</section>
