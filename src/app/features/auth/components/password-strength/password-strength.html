@if (score() > 0) {
  <ul class="strength__bars" role="list" aria-hidden="true">
    @for (segment of segments; track segment) {
      <li class="strength__bar" [class.strength__bar--on]="segment <= score()"></li>
    }
  </ul>
  <p class="strength__label">
    პაროლის სიძლიერე: <strong class="strength__value">{{ label() }}</strong>
  </p>
}
